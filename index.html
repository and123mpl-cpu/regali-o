<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tengo algo para ti 💙</title>

  <style>
    :root {
      --bg-1: #dff6ff;
      --bg-2: #bfe9ff;
      --paper: #ffffff;
      --ink: #24506b;
      --accent: #ffd45c;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;

      background:
        radial-gradient(circle at top, #ffffff 0%, transparent 35%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));

      color: var(--ink);

      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;

      overflow-x: hidden;
    }

    button {
      font-family: inherit;
    }

    [hidden] {
      display: none !important;
    }

    /* =========================
       PANTALLAS
       ========================= */

    .screen {
      width: min(560px, 100%);

      background: rgba(255, 255, 255, 0.94);

      border-radius: 28px;

      padding: 28px;

      text-align: center;

      box-shadow:
        0 20px 50px rgba(36, 80, 107, 0.18),
        0 5px 15px rgba(36, 80, 107, 0.08);

      animation: appear 0.6s ease;
    }

    h1 {
      margin: 0 0 20px;

      font-size: clamp(2rem, 7vw, 3.2rem);

      line-height: 1.05;

      color: var(--ink);
    }

    /* =========================
       IMÁGENES
       ========================= */

    #teaser-image,
    .gift-image {
      display: block;

      width: min(100%, 430px);

      max-height: 460px;

      object-fit: cover;

      margin: 0 auto;

      border-radius: 22px;

      border: 7px solid white;

      box-shadow:
        0 15px 30px rgba(36, 80, 107, 0.18);

      background: white;
    }

    #teaser-image.bump {
      animation: bump 0.45s ease;
    }

    /* =========================
       MENSAJES
       ========================= */

    .bubble {
      margin: 20px auto 12px;

      max-width: 480px;

      background: #f4fbff;

      border: 2px solid #c9ebfa;

      border-radius: 18px;

      padding: 15px 18px;

      font-size: 1.15rem;

      font-weight: 700;

      color: var(--ink);

      box-shadow:
        0 8px 18px rgba(36, 80, 107, 0.08);
    }

    /* =========================
       BOTONES
       ========================= */

    .buttons {
      display: flex;

      justify-content: center;

      align-items: center;

      gap: 15px;

      flex-wrap: wrap;

      margin-top: 25px;
    }

    .btn {
      border: 0;

      border-radius: 999px;

      padding: 14px 26px;

      font-size: 1.2rem;

      font-weight: 800;

      cursor: pointer;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        font-size 0.25s ease;

      min-width: 110px;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-yes {
      background: var(--accent);

      color: #5c4700;

      box-shadow:
        0 8px 18px rgba(230, 184, 47, 0.28);
    }

    .btn-yes:hover {
      background: #ffdc73;
    }

    .btn-no {
      background: #e8f6fc;

      color: var(--ink);

      border: 2px solid #b8dfef;

      box-shadow:
        0 8px 18px rgba(36, 80, 107, 0.12);
    }

    /* =========================
       BOTÓN DE MÚSICA
       ========================= */

    .music-toggle {
      position: fixed;

      top: 18px;
      right: 18px;

      z-index: 1000;

      width: 48px;
      height: 48px;

      border-radius: 50%;

      border: 2px solid rgba(36, 80, 107, 0.15);

      background: rgba(255, 255, 255, 0.9);

      color: var(--ink);

      font-size: 1.1rem;

      cursor: pointer;

      box-shadow:
        0 8px 20px rgba(36, 80, 107, 0.15);
    }

    /* =========================
       PANTALLA FINAL
       ========================= */

    .reveal {
      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      gap: 20px;
    }

    .final-text {
      margin: 0;

      font-size: clamp(2.4rem, 10vw, 4.8rem);

      line-height: 0.95;

      font-weight: 1000;

      color: var(--ink);

      text-transform: uppercase;

      text-shadow:
        3px 3px 0 white,
        6px 6px 0 rgba(36, 80, 107, 0.12);
    }

    /* =========================
       BOTÓN PRESIONA AQUÍ
       ========================= */

    .love-button {
      border: none;

      border-radius: 999px;

      padding: 16px 28px;

      background: #ff6b9d;

      color: white;

      font-size: 1.15rem;

      font-weight: 900;

      cursor: pointer;

      box-shadow:
        0 10px 25px rgba(255, 107, 157, 0.35);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .love-button:hover {
      transform: scale(1.06);

      box-shadow:
        0 14px 30px rgba(255, 107, 157, 0.45);
    }

    .love-button:active {
      transform: scale(0.96);
    }

    /* =========================
       LLUVIA DE LO AMO MUCHO
       ========================= */

    .love-rain {
      position: fixed;

      top: -80px;

      z-index: 3000;

      pointer-events: none;

      white-space: nowrap;

      font-size: clamp(1rem, 3vw, 1.6rem);

      font-weight: 900;

      color: #ff4f91;

      text-shadow:
        1px 1px 0 white,
        2px 2px 5px rgba(255, 79, 145, 0.25);

      animation: loveFall linear forwards;
    }

    @keyframes loveFall {

      0% {
        transform:
          translateY(-80px)
          rotate(-8deg);

        opacity: 0;
      }

      10% {
        opacity: 1;
      }

      100% {
        transform:
          translateY(115vh)
          rotate(8deg);

        opacity: 0;
      }
    }

    /* =========================
       CONFETI
       ========================= */

    .confetti {
      position: fixed;

      top: -40px;

      z-index: 2000;

      pointer-events: none;

      font-size: 25px;

      animation: fall linear forwards;
    }

    @keyframes fall {

      from {
        transform:
          translateY(-50px)
          rotate(0deg);

        opacity: 1;
      }

      to {
        transform:
          translateY(110vh)
          rotate(720deg);

        opacity: 0;
      }
    }

    /* =========================
       ANIMACIONES
       ========================= */

    @keyframes appear {

      from {
        opacity: 0;

        transform:
          translateY(15px)
          scale(0.98);
      }

      to {
        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }
    }

    @keyframes bump {

      0% {
        transform: scale(0.95);
      }

      60% {
        transform: scale(1.03);
      }

      100% {
        transform: scale(1);
      }
    }

    /* =========================
       CELULAR
       ========================= */

    @media (max-width: 600px) {

      body {
        padding: 14px;
      }

      .screen {
        padding: 20px;

        border-radius: 22px;
      }

      .btn {
        min-width: 105px;

        padding: 12px 22px;
      }

    }
  </style>
</head>


<body>

  <!-- =====================================================
       MÚSICA
       ===================================================== -->

  <audio
    id="bg-music"
    src="pretty-boy.mp3"
    autoplay
    loop
    preload="auto">
  </audio>

  <button
    id="music-toggle"
    class="music-toggle"
    type="button"
    aria-label="Activar música"
    title="Música">
    ▶
  </button>


  <!-- =====================================================
       PANTALLA PRINCIPAL
       ===================================================== -->

  <main
    class="screen"
    id="teaser-screen">

    <h1>
      ¿Aceptas mi regalo?
    </h1>


    <img
      id="teaser-image"
      src="https://i.pinimg.com/736x/e5/ce/76/e5ce76de98fc7d024c2a2b6d10bb2c25.jpg"
      alt="Tengo un regalo para ti">


    <p
      class="bubble"
      id="bubble"
      hidden>
    </p>


    <div class="buttons">

      <button
        class="btn btn-yes"
        id="btn-yes"
        type="button">
        Sí
      </button>


      <button
        class="btn btn-no"
        id="btn-no"
        type="button">
        No
      </button>

    </div>

  </main>


  <!-- =====================================================
       PANTALLA FINAL
       ===================================================== -->

  <main
    class="screen reveal"
    id="reveal-screen"
    hidden>


    <img
      class="gift-image"
      src="https://i.pinimg.com/736x/6f/de/64/6fde641b3ceeda2ac48b54a4c72a8979.jpg"
      alt="Tu regalo Hot Wheels">


    <p class="final-text">
      TOMA TUS HOTTTTWEELS
    </p>


    <!-- BOTÓN DE LA LLUVIA -->

    <button
      id="love-button"
      class="love-button"
      type="button">

      PRESIONA AQUÍ 

    </button>


  </main>


  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script>

    (() => {

      'use strict';


      /* =====================================================
         MÚSICA
         ===================================================== */

      const music =
        document.getElementById('bg-music');

      const musicToggle =
        document.getElementById('music-toggle');

      let playing = false;


      function setMusicState(on) {

        playing = on;

        musicToggle.textContent =
          on ? '❚❚' : '▶';

        musicToggle.setAttribute(
          'aria-label',
          on
            ? 'Pausar música'
            : 'Activar música'
        );

      }


      function startMusic() {

        music.volume = 1;

        music.play()

          .then(() => {

            setMusicState(true);

          })

          .catch(() => {

            /*
              Algunos navegadores bloquean
              el autoplay con sonido.
            */

          });

      }


      /*
        Intentamos iniciar la música
        apenas se abre la página.
      */

      window.addEventListener(
        'load',
        () => {

          startMusic();

          setTimeout(
            startMusic,
            500
          );

        }
      );


      /*
        Si el navegador bloquea el autoplay,
        comenzará al primer toque/clic.
      */

      document.addEventListener(
        'pointerdown',
        () => {

          if (!playing) {

            startMusic();

          }

        }
      );


      musicToggle.addEventListener(
        'click',
        (event) => {

          event.stopPropagation();

          if (playing) {

            music.pause();

            setMusicState(false);

          } else {

            startMusic();

          }

        }
      );


      /* =====================================================
         PANTALLAS
         ===================================================== */

      const teaserScreen =
        document.getElementById(
          'teaser-screen'
        );

      const revealScreen =
        document.getElementById(
          'reveal-screen'
        );


      /* =====================================================
         ELEMENTOS
         ===================================================== */

      const teaserImage =
        document.getElementById(
          'teaser-image'
        );

      const bubble =
        document.getElementById(
          'bubble'
        );

      const yesButton =
        document.getElementById(
          'btn-yes'
        );

      const noButton =
        document.getElementById(
          'btn-no'
        );


      /* =====================================================
         BOTÓN DE AMOR
         ===================================================== */

      const loveButton =
        document.getElementById(
          'love-button'
        );


      /* =====================================================
         IMÁGENES Y MENSAJES
         ===================================================== */

      const steps = [

        {
          text: 'apura di que si',

          img:
            'https://i.pinimg.com/736x/a2/27/4d/a2274d2fdd600edaf98edc5239011223.jpg',

          alt: 'Apura di que sí'
        },


        {
          text: 'no me caes, sapo',

          img:
            'https://i.pinimg.com/736x/96/47/ba/9647ba30da8fb9b7d7b6ad7b312b4a4c.jpg',

          alt: 'No me caes, sapo'
        },


        {
          text:
            'es bromi, pero me salió bonito si o no?',

          img:
            'https://i.pinimg.com/736x/d3/fd/fe/d3fdfece68689c7133dc708b34de2547.jpg',

          alt:
            'Es bromi, pero me salió bonito si o no'
        },


        {
          text:
            'ji, esta cute poner imagenes de gatos',

          img:
            'https://i.pinimg.com/736x/87/97/8c/87978ce7f14835b20c2db3aed9536d0a.jpg',

          alt:
            'Gato cute'
        },


        {
          text:
            'xd, cuteee',

          img:
            'https://i.pinimg.com/736x/70/74/26/707426d8d92d6e85da4becb35f921098.jpg',

          alt:
            'Gato cute'
        },


        {
          text:
            'pude poner un giiif, beshito. ahora si',

          img:
            'cat-kiss-kiss-cat.gif',

          alt:
            'GIF de gatitos dándose un besito'
        },


        {
          text:
            'otro gatiño',

          img:
            'https://i.pinimg.com/736x/79/1b/3a/791b3a33b2ce3320ca1817310ad9ae58.jpg',

          alt:
            'Oño'
        },


        {
          text:
            'AHORA SIII',

          img:
            'https://i.pinimg.com/1200x/89/aa/84/89aa84eb63e910169c6443bd15c3724b.jpg',

          alt:
            'Ahora sí'
        }

      ];


      /* =====================================================
         CONTADOR DE NO
         ===================================================== */

      let noClicks = 0;


      /* =====================================================
         BOTÓN NO
         ===================================================== */

      noButton.addEventListener(
        'click',
        () => {

          const step =
            steps[noClicks];

          noClicks++;


          bubble.hidden = false;

          bubble.textContent =
            step.text;


          teaserImage.src =
            step.img;

          teaserImage.alt =
            step.alt;


          teaserImage.classList.remove(
            'bump'
          );

          void teaserImage.offsetWidth;

          teaserImage.classList.add(
            'bump'
          );


          /*
            El botón SÍ crece
            cada vez que presionan NO.
          */

          yesButton.style.fontSize =
            (
              1.2 +
              noClicks * 0.35
            ) +
            'rem';


          /*
            El botón NO se hace pequeño.
          */

          noButton.style.transform =
            'scale(' +
            Math.max(
              0.6,
              1 - noClicks * 0.08
            ) +
            ')';


          /*
            Después del último NO,
            desaparece el botón.
          */

          if (
            noClicks >= steps.length
          ) {

            noButton.hidden = true;

            yesButton.focus();

          }

        }
      );


      /* =====================================================
         BOTÓN SÍ
         ===================================================== */

      yesButton.addEventListener(
        'click',
        () => {

          teaserScreen.hidden = true;

          revealScreen.hidden = false;

          launchConfetti();

        }
      );


      /* =====================================================
         CONFETI
         ===================================================== */

      function launchConfetti() {

        const pieces = [
          '🎉',
          '✨',
          '🎁',
          '💛',
          '🎊',
          '💙'
        ];


        for (
          let i = 0;
          i < 45;
          i++
        ) {

          const el =
            document.createElement(
              'span'
            );


          el.className =
            'confetti';


          el.textContent =
            pieces[
              i % pieces.length
            ];


          el.style.left =
            Math.random() * 100 +
            'vw';


          el.style.animationDuration =
            (
              2.5 +
              Math.random() * 2.5
            ) +
            's';


          el.style.animationDelay =
            Math.random() * 1.2 +
            's';


          document.body.appendChild(
            el
          );


          el.addEventListener(
            'animationend',
            () => {

              el.remove();

            }
          );

        }

      }


      /* =====================================================
         LLUVIA DE "LO AMO MUCHO"
         ===================================================== */

      loveButton.addEventListener(
        'click',
        () => {

          createLoveRain();

        }
      );


      function createLoveRain() {

        /*
          Crea 70 mensajes
          que caen por la pantalla.
        */

        for (
          let i = 0;
          i < 70;
          i++
        ) {

          setTimeout(
            () => {

              const love =
                document.createElement(
                  'div'
                );


              love.className =
                'love-rain';


              love.textContent =
                'LO AMO MUCHO ';


              /*
                Posición horizontal aleatoria.
              */

              love.style.left =
                Math.random() * 100 +
                'vw';


              /*
                Tamaño aleatorio.
              */

              const size =
                1 +
                Math.random() * 0.7;


              love.style.fontSize =
                size + 'rem';


              /*
                Velocidad aleatoria.
              */

              love.style.animationDuration =
                (
                  3 +
                  Math.random() * 3
                ) +
                's';


              document.body.appendChild(
                love
              );


              /*
                Lo eliminamos cuando
                termina de caer.
              */

              love.addEventListener(
                'animationend',
                () => {

                  love.remove();

                }
              );

            },

            i * 70
          );

        }

      }

    })();

  </script>

</body>
</html>
