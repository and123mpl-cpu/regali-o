<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tengo algo para ti 💙</title>

  <style>
    :root {
      --bg-1: #dff6ff;
      --bg-2: #bfe9ff;
      --paper: #ffffff;
      --ink: #24506b;
      --accent: #ffd45c;
      --accent-dark: #e6b82f;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, #ffffff 0%, transparent 35%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));

      color: var(--ink);

      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;

      overflow-x: hidden;
    }

    button {
      font-family: inherit;
    }

    .screen {
      width: min(560px, 100%);

      background: rgba(255, 255, 255, 0.92);

      border-radius: 28px;

      padding: 28px;

      text-align: center;

      box-shadow:
        0 20px 50px rgba(36, 80, 107, 0.18),
        0 5px 15px rgba(36, 80, 107, 0.08);

      animation: appear 0.6s ease;
    }

    h1 {
      margin: 0 0 20px;

      font-size: clamp(2rem, 7vw, 3.2rem);

      line-height: 1.05;

      color: var(--ink);
    }

    .main-image,
    #teaser-image,
    .gift-image {
      display: block;

      width: min(100%, 430px);

      max-height: 460px;

      object-fit: cover;

      margin: 0 auto;

      border-radius: 22px;

      border: 7px solid white;

      box-shadow:
        0 15px 30px rgba(36, 80, 107, 0.18);

      background: white;
    }

    #teaser-image.bump {
      animation: bump 0.45s ease;
    }

    .bubble {
      margin: 20px auto 12px;

      max-width: 480px;

      background: #f4fbff;

      border: 2px solid #c9ebfa;

      border-radius: 18px;

      padding: 15px 18px;

      font-size: 1.15rem;

      font-weight: 700;

      color: var(--ink);

      box-shadow: 0 8px 18px rgba(36, 80, 107, 0.08);
    }

    .buttons {
      display: flex;

      justify-content: center;

      align-items: center;

      gap: 15px;

      flex-wrap: wrap;

      margin-top: 25px;
    }

    .btn {
      border: 0;

      border-radius: 999px;

      padding: 14px 26px;

      font-size: 1.2rem;

      font-weight: 800;

      cursor: pointer;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        font-size 0.25s ease;

      min-width: 110px;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-yes {
      background: var(--accent);

      color: #5c4700;

      box-shadow:
        0 8px 18px rgba(230, 184, 47, 0.28);
    }

    .btn-yes:hover {
      background: #ffdc73;
    }

    .btn-no {
      background: #e8f6fc;

      color: var(--ink);

      border: 2px solid #b8dfef;

      box-shadow:
        0 8px 18px rgba(36, 80, 107, 0.12);
    }

    .music-toggle {
      position: fixed;

      top: 18px;
      right: 18px;

      z-index: 1000;

      width: 48px;
      height: 48px;

      border-radius: 50%;

      border: 2px solid rgba(36, 80, 107, 0.15);

      background: rgba(255, 255, 255, 0.9);

      color: var(--ink);

      font-size: 1.1rem;

      cursor: pointer;

      box-shadow:
        0 8px 20px rgba(36, 80, 107, 0.15);
    }

    .reveal {
      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      gap: 22px;
    }

    .final-text {
      margin: 0;

      font-size: clamp(2.4rem, 10vw, 4.8rem);

      line-height: 0.95;

      font-weight: 1000;

      color: var(--ink);

      text-transform: uppercase;

      text-shadow:
        3px 3px 0 white,
        6px 6px 0 rgba(36, 80, 107, 0.12);
    }

    .confetti {
      position: fixed;

      top: -40px;

      z-index: 2000;

      pointer-events: none;

      font-size: 25px;

      animation: fall linear forwards;
    }

    [hidden] {
      display: none !important;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(15px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes bump {
      0% {
        transform: scale(0.95);
      }

      60% {
        transform: scale(1.03);
      }

      100% {
        transform: scale(1);
      }
    }

    @keyframes fall {
      from {
        transform: translateY(-50px) rotate(0deg);
        opacity: 1;
      }

      to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 14px;
      }

      .screen {
        padding: 20px;
        border-radius: 22px;
      }

      .btn {
        min-width: 105px;
        padding: 12px 22px;
      }
    }
  </style>
</head>

<body>

  <!-- =====================================================
       MÚSICA
       ===================================================== -->

  <audio
    id="bg-music"
    src="pretty-boy.mp3"
    autoplay
    loop
    preload="auto">
  </audio>

  <button
    id="music-toggle"
    class="music-toggle"
    type="button"
    aria-label="Activar música"
    title="Música"
    hidden>
    ▶
  </button>


  <!-- =====================================================
       PANTALLA PRINCIPAL
       ===================================================== -->

  <main
    class="screen"
    id="teaser-screen">

    <h1>
      ¿Aceptas mi regalo?
    </h1>

    <!-- IMAGEN INICIAL -->

    <img
      id="teaser-image"
      src="https://i.pinimg.com/736x/e5/ce/76/e5ce76de98fc7d024c2a2b6d10bb2c25.jpg"
      alt="Tengo un regalo para ti">

    <!-- MENSAJE -->

    <p
      class="bubble"
      id="bubble"
      hidden>
    </p>

    <!-- BOTONES -->

    <div class="buttons">

      <button
        class="btn btn-yes"
        id="btn-yes"
        type="button">
        Sí
      </button>

      <button
        class="btn btn-no"
        id="btn-no"
        type="button">
        No
      </button>

    </div>

  </main>


  <!-- =====================================================
       PANTALLA FINAL
       ===================================================== -->

  <main
    class="screen reveal"
    id="reveal-screen"
    hidden>

    <img
      class="gift-image"
      src="https://i.pinimg.com/736x/6f/de/64/6fde641b3ceeda2ac48b54a4c72a8979.jpg"
      alt="Tu regalo Hot Wheels">

    <p class="final-text">
      TOMA TUS HOTTTTWEELS
    </p>

  </main>


  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script>

    (() => {

      'use strict';


      /* =====================================================
         CONFIGURACIÓN DE MÚSICA
         ===================================================== */

      const MUSIC_URL = 'pretty-boy.mp3';

      const music = document.getElementById('bg-music');

      const musicToggle =
        document.getElementById('music-toggle');

      let playing = false;


      function setMusicState(on) {

        playing = on;

        musicToggle.textContent =
          on ? '❚❚' : '▶';

        musicToggle.setAttribute(
          'aria-label',
          on
            ? 'Pausar música'
            : 'Activar música'
        );

      }


      function startMusic() {

        music.volume = 1;

        music.play()
          .then(() => {

            setMusicState(true);

          })
          .catch(() => {

            /*
              Algunos navegadores bloquean
              el autoplay con sonido.

              En ese caso la música comenzará
              cuando la persona haga clic.
            */

          });

      }


      /*
        Intentar reproducir la música
        inmediatamente al abrir la página.
      */

      window.addEventListener(
        'load',
        () => {

          startMusic();

          setTimeout(
            startMusic,
            500
          );

        }
      );


      /*
        Si el navegador bloquea el autoplay,
        cualquier primer clic inicia la música.
      */

      document.addEventListener(
        'pointerdown',
        () => {

          if (!playing) {

            startMusic();

          }

        }
      );


      /*
        Botón de música
      */

      musicToggle.addEventListener(
        'click',
        (event) => {

          event.stopPropagation();

          if (playing) {

            music.pause();

            setMusicState(false);

          } else {

            startMusic();

          }

        }
      );


      /*
        Mostrar botón de música
      */

      musicToggle.hidden = false;


      /* =====================================================
         PANTALLAS
         ===================================================== */

      const teaserScreen =
        document.getElementById(
          'teaser-screen'
        );

      const revealScreen =
        document.getElementById(
          'reveal-screen'
        );


      /* =====================================================
         ELEMENTOS
         ===================================================== */

      const teaserImage =
        document.getElementById(
          'teaser-image'
        );

      const bubble =
        document.getElementById(
          'bubble'
        );

      const yesButton =
        document.getElementById(
          'btn-yes'
        );

      const noButton =
        document.getElementById(
          'btn-no'
        );


      /* =====================================================
         IMÁGENES Y MENSAJES
         ===================================================== */

      const steps = [

        {
          text: 'apura di que si',

          img:
            'https://i.pinimg.com/736x/a2/27/4d/a2274d2fdd600edaf98edc5239011223.jpg',

          alt: 'Apura di que sí'
        },

        {

          text: 'no me caes, sapo',

          img:
            'https://i.pinimg.com/736x/96/47/ba/9647ba30da8fb9b7d7b6ad7b312b4a4c.jpg',

          alt: 'No me caes, sapo'
        },

        {

          text:
            'es bromi, pero me salió bonito si o no?',

          img:
            'https://i.pinimg.com/736x/d3/fd/fe/d3fdfece68689c7133dc708b34de2547.jpg',

          alt:
            'Es bromi, pero me salió bonito si o no'
        },

        {

          text:
            'ji, esta cute poner imagenes de gatos',

          img:
            'https://i.pinimg.com/736x/87/97/8c/87978ce7f14835b20c2db3aed9536d0a.jpg',

          alt:
            'Gato cute'
        },

        {

          text:
            'xd, cuteee',

          img:
            'https://i.pinimg.com/736x/70/74/26/707426d8d92d6e85da4becb35f921098.jpg',

          alt:
            'Gato cute'
        },

        {

          text:
            'pude poner un giiif, beshito. ahora si',

          img:
            'cat-kiss-kiss-cat.gif',

          alt:
            'GIF de gatitos dándose un besito'
        },

        {

          text:
            'otro gatiño',

          img:
            'https://i.pinimg.com/736x/79/1b/3a/791b3a33b2ce3320ca1817310ad9ae58.jpg',

          alt:
            'Oño'
        },

        {

          text:
            'AHORA SIII',

          img:
            'https://i.pinimg.com/1200x/89/aa/84/89aa84eb63e910169c6443bd15c3724b.jpg',

          alt:
            'Ahora sí'
        }

      ];


      /* =====================================================
         CONTADOR
         ===================================================== */

      let noClicks = 0;


      /* =====================================================
         BOTÓN NO
         ===================================================== */

      noButton.addEventListener(
        'click',
        () => {

          /*
            Tomamos la imagen y mensaje
            correspondiente al siguiente No.
          */

          const step =
            steps[noClicks];


          noClicks++;


          /*
            Mostrar mensaje
          */

          bubble.hidden = false;

          bubble.textContent =
            step.text;


          /*
            Cambiar imagen
          */

          teaserImage.src =
            step.img;

          teaserImage.alt =
            step.alt;


          /*
            Animación de imagen
          */

          teaserImage.classList.remove(
            'bump'
          );

          void teaserImage.offsetWidth;

          teaserImage.classList.add(
            'bump'
          );


          /*
            Hacer crecer el botón Sí
          */

          yesButton.style.fontSize =
            (
              1.2 +
              noClicks * 0.35
            ) +
            'rem';


          /*
            Hacer pequeño el botón No
          */

          noButton.style.transform =
            'scale(' +
            Math.max(
              0.6,
              1 - noClicks * 0.08
            ) +
            ')';


          /*
            Después del último No,
            ocultar completamente el botón No.
          */

          if (
            noClicks >= steps.length
          ) {

            noButton.hidden = true;

            yesButton.focus();

          }

        }
      );


      /* =====================================================
         BOTÓN SÍ
         ===================================================== */

      yesButton.addEventListener(
        'click',
        () => {

          /*
            Mostrar solamente el regalo final
          */

          teaserScreen.hidden = true;

          revealScreen.hidden = false;


          /*
            Lanzar confeti
          */

          launchConfetti();

        }
      );


      /* =====================================================
         CONFETI
         ===================================================== */

      function launchConfetti() {

        const pieces = [
          '🎉',
          '✨',
          '🎁',
          '💛',
          '🎊'
        ];


        for (
          let i = 0;
          i < 40;
          i++
        ) {

          const el =
            document.createElement(
              'span'
            );


          el.className =
            'confetti';


          el.textContent =
            pieces[
              i % pieces.length
            ];


          el.style.left =
            Math.random() * 100 +
            'vw';


          el.style.animationDuration =
            (
              2.5 +
              Math.random() * 2.5
            ) +
            's';


          el.style.animationDelay =
            Math.random() * 1.2 +
            's';


          document.body.appendChild(
            el
          );


          el.addEventListener(
            'animationend',
            () => {

              el.remove();

            }
          );

        }

      }

    })();

  </script>

</body>
</html>
